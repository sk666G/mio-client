name: Rebuild Schizo from Open Zio

on:
  push:
    branches: [zio-rebuild, zio-rebuild-v7, 'lunyx/final-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-and-build:
    if: github.ref_name == 'zio-rebuild' || github.ref_name == 'zio-rebuild-v7' || startsWith(github.ref_name, 'lunyx/final-')
    runs-on: ubuntu-latest
    steps:
      - name: Check out Schizo staging branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Capture reconstruction inputs
        env:
          EXPECTED_REBUILD_BASE_COMMIT: 70decd4187177dc2c8d65a0cfb0f57fbcb711af8
        shell: bash
        run: |
          set -euo pipefail
          source_head="$(git rev-parse HEAD)"
          git fetch --no-tags origin zio-rebuild-raw-base-v1
          rebuild_base="$(git rev-parse origin/zio-rebuild-raw-base-v1)"
          test "$rebuild_base" = "$EXPECTED_REBUILD_BASE_COMMIT"
          printf 'SOURCE_HEAD=%s\n' "$source_head" >> "$GITHUB_ENV"
          printf 'REBUILD_BASE_COMMIT=%s\n' "$rebuild_base" >> "$GITHUB_ENV"
          git diff --binary "$rebuild_base" "$source_head" -- .             ':(exclude).github/**'             ':(exclude)tools/**'             ':(exclude)LICENSES/**'             > "$RUNNER_TEMP/schizo-overlay.patch"

      - name: Install Java 21 toolchain
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Java 25 Gradle runtime
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Fetch pinned Open Zio source
        env:
          UPSTREAM_COMMIT: 2fec97aa0c52860f9252b61543dce8fc9825e081
        run: |
          git clone --no-tags https://git.spectrum.best/SpectrumDevs/open-zio.git "$RUNNER_TEMP/open-zio"
          git -C "$RUNNER_TEMP/open-zio" checkout --detach "$UPSTREAM_COMMIT"
          test "$(git -C "$RUNNER_TEMP/open-zio" rev-parse HEAD)" = "$UPSTREAM_COMMIT"

      - name: Run rebuild security tests
        env:
          PYTHONDONTWRITEBYTECODE: 1
        run: python3 -m unittest discover -s tests -v

      - name: Rebuild raw Schizo baseline from upstream
        env:
          PYTHONDONTWRITEBYTECODE: 1
        run: python3 tools/rebrand_open_zio.py "$RUNNER_TEMP/open-zio" . --replace-existing

      - name: Normalize raw rebuild file modes
        run: chmod +x ./gradlew

      - name: Verify raw rebuild baseline
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --exit-code "$REBUILD_BASE_COMMIT" -- . ':(exclude).github/**' ':(exclude)tools/**' ':(exclude)LICENSES/**'
          git reset --mixed "$SOURCE_HEAD"

      - name: Replay Schizo source overlay
        shell: bash
        run: |
          set -euo pipefail
          git apply --check "$RUNNER_TEMP/schizo-overlay.patch"
          git apply "$RUNNER_TEMP/schizo-overlay.patch"
          git diff --exit-code "$SOURCE_HEAD" -- .
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Build reconstructed remapped client
        env:
          ORG_GRADLE_JAVA_INSTALLATIONS_PATHS: ${{ env.JAVA_HOME_21_X64 }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon clean build; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Verify reconstructed artifacts and record provenance
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name 'schizo-*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | sort)
          if [ "${#jars[@]}" -ne 1 ]; then
            printf 'Expected exactly one runnable Schizo JAR, found %s\n' "${#jars[@]}" >&2
            printf '%s\n' "${jars[@]}" >&2
            exit 1
          fi
          mapfile -t source_jars < <(find build/libs -maxdepth 1 -type f -name 'schizo-*-sources.jar' | sort)
          if [ "${#source_jars[@]}" -ne 1 ]; then
            printf 'Expected exactly one Schizo sources JAR, found %s\n' "${#source_jars[@]}" >&2
            printf '%s\n' "${source_jars[@]}" >&2
            exit 1
          fi

          jar_file="${jars[0]}"
          source_jar="${source_jars[0]}"
          for required in fabric.mod.json LICENSING.md THIRD_PARTY_NOTICES.md LICENSES/DiscordIPC-APACHE-2.0.txt; do
            jar tf "$jar_file" | grep -Fqx "$required"
          done
          for required in LICENSING.md THIRD_PARTY_NOTICES.md LICENSES/DiscordIPC-APACHE-2.0.txt; do
            jar tf "$source_jar" | grep -Fqx "$required"
          done
          for required_class in             dev/schizo/client/commands/HealthCommand.class             dev/schizo/client/config/SafeModeManager.class             dev/schizo/client/config/ModuleConfigSchema.class             dev/schizo/client/events/bus/EventFailureTracker.class             dev/schizo/client/integrations/ModuleCompatibility.class             dev/schizo/client/bootstrap/MixinModuleRegistry.class; do
            jar tf "$jar_file" | grep -Fqx "$required_class"
          done

          jar tf "$jar_file" | grep '^META-INF/jars/.*[.]jar$' | sort > build/libs/NESTED_JARS.txt || true
          sha256sum "$jar_file" > build/libs/SHA256SUMS.txt
          printf '%s\n' "$SOURCE_HEAD" > build/libs/COMMIT_SHA.txt
          printf '%s\n' "$REBUILD_BASE_COMMIT" > build/libs/REBUILD_BASE_SHA.txt
          git rev-parse "$SOURCE_HEAD^{tree}" > build/libs/SOURCE_TREE_SHA.txt

      - name: Upload reconstructed client artifact
        uses: actions/upload-artifact@v6
        with:
          name: schizo-zio-rebuild
          path: |
            build/libs/schizo-*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
            build/libs/SHA256SUMS.txt
            build/libs/COMMIT_SHA.txt
            build/libs/REBUILD_BASE_SHA.txt
            build/libs/SOURCE_TREE_SHA.txt
            build/libs/NESTED_JARS.txt
          if-no-files-found: error
