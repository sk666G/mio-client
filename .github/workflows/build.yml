name: Build

on:
  push:
    branches: [main, codex/reliability-hardening, codex/schizo-master-integration, lunyx/integration-candidate]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Run rebuild security tests
        run: python3 -m unittest discover -s tests -v

      - name: Install Java 21 toolchain
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Java 25 Gradle runtime
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Build mod
        env:
          ORG_GRADLE_JAVA_INSTALLATIONS_PATHS: ${{ env.JAVA_HOME_21_X64 }}
        run: ./gradlew --no-daemon clean build

      - name: Verify remapped artifact and record provenance
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name 'schizo-*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | sort)
          if [ "${#jars[@]}" -ne 1 ]; then
            printf 'Expected exactly one runnable Schizo JAR, found %s\n' "${#jars[@]}" >&2
            printf '%s\n' "${jars[@]}" >&2
            exit 1
          fi
          jar_file="${jars[0]}"
          jar tf "$jar_file" | grep -qx 'fabric.mod.json'
          sha256sum "$jar_file" > build/libs/SHA256SUMS.txt
          printf '%s\n' "$GITHUB_SHA" > build/libs/COMMIT_SHA.txt

      - name: Upload verified remapped mod jar
        uses: actions/upload-artifact@v6
        with:
          name: schizo-client
          path: |
            build/libs/schizo-*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
            build/libs/SHA256SUMS.txt
            build/libs/COMMIT_SHA.txt
          if-no-files-found: error
