name: Build

on:
  push:
    branches: [main, codex/reliability-hardening, codex/schizo-master-integration, codex/release-readiness-hardening]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Run rebuild security tests
        run: python3 -m unittest discover -s tests -v

      - name: Install Java 21 toolchain
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Java 25 Gradle runtime
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Build mod
        env:
          ORG_GRADLE_JAVA_INSTALLATIONS_PATHS: ${{ env.JAVA_HOME_21_X64 }}
        run: ./gradlew --no-daemon --warning-mode all clean build

      - name: Verify remapped jar contents
        run: python3 tools/verify_release_jar.py build/libs/schizo-0.1.0.jar

      - name: Upload remapped mod jar
        uses: actions/upload-artifact@v7
        with:
          name: schizo-client
          path: build/libs/*.jar
          if-no-files-found: error
