name: Schizo client gametests

on:
  push:
    branches: [zio-rebuild-v7, lunyx/runtime-validation-v1, lunyx/runtime-codex-integration-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client-gametest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out staging source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Java 21 toolchain
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Java 25 Gradle runtime
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Install headless graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-vulkan-drivers

      - name: Run client gametests
        env:
          ORG_GRADLE_JAVA_INSTALLATIONS_PATHS: ${{ env.JAVA_HOME_21_X64 }}
          JAVA_TOOL_OPTIONS: -Dfabric.client.gametest.disableNetworkSynchronizer=true
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rm -f client-gametest-gradle.out
            set +e
            ./gradlew --no-daemon runClientGameTest 2>&1 | tee client-gametest-gradle.out
            gradle_status=${PIPESTATUS[0]}
            set -e

            if [ "$gradle_status" -eq 0 ]; then
              exit 0
            fi

            if ! grep -Eiq '429|Too Many Requests|HTTP (500|502|503|504)|Received status code (500|502|503|504)|Connection reset|Connection timed out|Read timed out|Temporary failure|Could not GET .*maven|Could not GET .*gradle' client-gametest-gradle.out; then
              exit "$gradle_status"
            fi

            if [ "$attempt" -eq 3 ]; then
              exit "$gradle_status"
            fi

            printf 'Transient dependency/network failure detected; retrying client gametest (%s/3).\n' "$attempt" >&2
            sleep $((attempt * 15))
          done

      - name: Verify client gametest evidence and clean Schizo diagnostics
        shell: bash
        run: |
          set -euo pipefail
          run_dir="build/run/clientGameTest"
          log="$run_dir/logs/latest.log"
          test -s "$log"

          test -s "$run_dir/screenshots/0000_schizo-clickgui.png"
          test -s "$run_dir/screenshots/0001_schizo-command-palette.png"
          test -s "$run_dir/screenshots/0002_schizo-performance-center.png"
          test -s "$run_dir/screenshots/0003_schizo-hud-editor.png"
          test -s "$run_dir/screenshots/0004_schizo-hud-editor-reconnect.png"

          if grep -E '\[.*(WARN|ERROR).*\] \(Schizo\)|\(Schizo\).*\[(WARN|ERROR)\]' "$log"; then
            echo "Schizo emitted WARN/ERROR diagnostics during the successful client gametest" >&2
            exit 1
          fi

          if grep -E 'MixinApplyError|InvalidMixinException|InjectionError|MixinTransformerError|Minecraft has crashed|Crash report saved' "$log"; then
            echo "Fatal mixin/crash signature found in successful client gametest log" >&2
            exit 1
          fi

          python3 - <<'PY'
          import pathlib, struct
          root = pathlib.Path("build/run/clientGameTest/screenshots")
          files = [
              root / "0000_schizo-clickgui.png",
              root / "0001_schizo-command-palette.png",
              root / "0002_schizo-performance-center.png",
              root / "0003_schizo-hud-editor.png",
              root / "0004_schizo-hud-editor-reconnect.png",
          ]
          for path in files:
              data = path.read_bytes()
              if len(data) < 10_000 or data[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"invalid or suspiciously small screenshot: {path}")
              width, height = struct.unpack(">II", data[16:24])
              if width < 640 or height < 360:
                  raise SystemExit(f"screenshot viewport too small: {path} = {width}x{height}")
          PY

      - name: List client gametest evidence
        if: always()
        shell: bash
        run: |
          find . -type f \( -path '*/screenshots/*.png' -o -name 'latest.log' \) -print | sort || true

      - name: Upload client gametest screenshots and logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: schizo-client-gametest-evidence
          path: |
            **/screenshots/*.png
            **/logs/latest.log
          if-no-files-found: warn
